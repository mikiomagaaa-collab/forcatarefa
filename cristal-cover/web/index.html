<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>L.I.L.Y</title>
    <meta name="description" content="L.I.L.Y Web: a assistente do PROJECT LIQUID FLIP no computador — conversa, Codex, vídeo e avatar." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0a14" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="L.I.L.Y" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <canvas class="brand-avatar" id="brand-avatar" width="40" height="40" aria-hidden="true"></canvas>
          <div><strong>L.I.L.Y</strong><small>PROJECT LIQUID FLIP</small></div>
        </div>
        <button class="primary new" id="new-chat" type="button">Nova conversa</button>
        <nav class="nav" id="nav"></nav>
        <div class="recent">
          <h3>Recentes</h3>
          <ul id="recent"></ul>
        </div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <main class="main">
        <header class="top">
          <button class="icon-btn menu" id="menu" type="button" aria-label="Abrir o menu"></button>
          <h1 id="title">Conversa</h1>
          <div class="top-right" id="top-right"></div>
        </header>
        <section class="view" id="view" aria-live="polite"></section>
      </main>
      <aside class="panel" id="panel" hidden></aside>
    </div>
    <noscript>A L.I.L.Y Web precisa de JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>

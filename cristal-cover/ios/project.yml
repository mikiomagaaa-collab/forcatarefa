# L.I.L.Y para iPhone (SwiftUI). O projeto do Xcode é gerado pelo XcodeGen: `xcodegen generate`.
# O workflow .github/workflows/lily-ios.yml gera, testa no simulador e compila num Mac do GitHub.
name: LILY
options:
  bundleIdPrefix: app.lily
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LILY:
    type: application
    platform: iOS
    sources:
      - path: LILY
      - path: ../legal
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lily.ios
        PRODUCT_NAME: LILY
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "L.I.L.Y"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "A L.I.L.Y usa o microfone só quando você toca para falar com ela."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Para entender o que você fala (no próprio iPhone quando o português estiver disponível)."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Para salvar nas Fotos as imagens e os vídeos que você pedir."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - LILYTests
  LILYTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LILYTests
    dependencies:
      - target: LILY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lily.ios.tests

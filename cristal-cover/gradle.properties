org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# O LiteRT 2.2.0 publica dois artefatos com o mesmo namespace (litert e litert-api);
# sem isto o AGP 9 recusa a junção dos manifestos do app da IA.
android.uniquePackageNames=false

# O AGP 9 liga o "modo estrito" das regras do R8: "-keep class X" deixa de manter o construtor vazio.
# Muitas bibliotecas ainda escrevem as regras do jeito antigo e criam classes por reflexão (o Room do
# WorkManager, os registrars do ML Kit). No modo estrito o construtor sumia e a L.I.L.Y AI fechava antes
# de abrir ("Failed to create an instance of class androidx.work.impl.WorkDatabase"). Volta ao
# comportamento do AGP 8, em que essas regras valem como as bibliotecas esperam.
android.r8.strictFullModeForKeepRules=false

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# O LiteRT 2.2.0 publica dois artefatos com o mesmo namespace (litert e litert-api);
# sem isto o AGP 9 recusa a junção dos manifestos do app da IA.
android.uniquePackageNames=false

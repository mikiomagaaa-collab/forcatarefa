name: Organizar arquivos do site
on:
  push:
    paths: [source.zip, .github/workflows/initialize.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar arquivos organizados
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          with ZipFile('source.zip') as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root) or '.git' in target.relative_to(root).parts:
                      raise ValueError('Invalid archive path')
              for item in archive.infolist():
                  if not item.filename.startswith(".github/workflows/"):
                      archive.extract(item,root)
          Path('source.zip').unlink()
          pass
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Organizar projeto FORÇA TAREFA para publicação"
          git push
